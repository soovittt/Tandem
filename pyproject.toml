[project]
name = "tandem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sovit", email = "sovitn@uci.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Semantic memory backend. Heavy (pulls chromadb + a local embedder), so it's
# opt-in: `uv sync --extra mem0` then set MEMORY_BACKEND=mem0.
mem0 = ["mem0ai>=0.1.0"]
mcp = [
    "mcp>=2.3.0",
]

[project.scripts]
tandem = "tandem.cli:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
